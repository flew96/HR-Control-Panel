{% extends "hr/base.html" %}

{% block title %}{{ title }} - HR Control Panel{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Directory</p>
        <h1>{{ title }}</h1>
    </div>
</section>

<form class="panel form-panel narrow-form" method="post">
    {% csrf_token %}
    {% for field in form %}
        {% if field.is_hidden %}
            {{ field }}
        {% else %}
            <label class="{% if field.field.widget.input_type == 'checkbox' %}checkbox-row form-checkbox{% endif %}">
                <span>{{ field.label }}</span>
                {{ field }}
                {% if field.errors %}<small class="error">{{ field.errors|join:", " }}</small>{% endif %}
            </label>
        {% endif %}
    {% endfor %}
    <div class="form-actions">
        <button class="btn primary" type="submit">Сохранить</button>
        <a class="btn ghost" href="{{ back_url }}">Отмена</a>
    </div>
</form>
{% endblock %}
